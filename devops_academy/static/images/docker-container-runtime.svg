<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" rx="12" fill="url(#bgGrad3)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="640" height="42" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="38" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="21" r="5" fill="#10b981"/>
  <text x="74" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">DOCKER CONTAINER: RUNTIME ISOLATION &amp; COPY-ON-WRITE</text>

  <!-- Left: Container Stack -->
  <g transform="translate(30, 58)">
    <!-- Writable Layer (upperdir) -->
    <rect x="0" y="0" width="340" height="52" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="14" y="22" font-family="monospace" font-size="11" font-weight="800" fill="#b45309">Writable Container Layer (upperdir)</text>
    <text x="14" y="38" font-family="monospace" font-size="9" fill="#d97706">Read/Write Copy-on-Write · /tmp/session.log · diffs only</text>
    <rect x="250" y="10" width="76" height="18" rx="4" fill="#f59e0b"/>
    <text x="256" y="22" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#fff">EPHEMERAL</text>

    <!-- Union Mount Separator -->
    <path d="M 0 60 L 340 60" stroke="#0284c7" stroke-width="2"/>
    <text x="70" y="74" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#0284c7">▲ OverlayFS Merged Mount Boundary ▲</text>

    <!-- Underlying Read-only Layers (lowerdir) -->
    <rect x="0" y="86" width="340" height="38" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="14" y="108" font-family="monospace" font-size="10" font-weight="600" fill="#475569">Image Layer: App Source Code (Read-Only)</text>

    <rect x="0" y="130" width="340" height="38" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="14" y="152" font-family="monospace" font-size="10" font-weight="600" fill="#475569">Image Layer: Python Dependencies (Read-Only)</text>

    <rect x="0" y="174" width="340" height="42" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="14" y="198" font-family="monospace" font-size="10" font-weight="600" fill="#475569">Image Layer: Debian Base OS (Read-Only)</text>
  </g>

  <!-- Right: Host Kernel Isolation Metrics -->
  <g transform="translate(400, 58)">
    <rect width="210" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="34" rx="8" fill="#0f172a"/>
    <text x="16" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">HOST KERNEL ISOLATION</text>

    <text x="16" y="58" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">Process PID Namespace:</text>
    <text x="16" y="74" font-family="monospace" font-size="10" font-weight="700" fill="#0284c7">Container PID 1 (Host PID 4821)</text>

    <text x="16" y="102" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">Virtual Network Interface:</text>
    <text x="16" y="118" font-family="monospace" font-size="10" font-weight="700" fill="#059669">eth0 @ 172.17.0.2 / bridge</text>

    <text x="16" y="146" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">Port Forwarding Contract:</text>
    <text x="16" y="162" font-family="monospace" font-size="10" font-weight="700" fill="#d97706">0.0.0.0:5000 -&gt; 5000/tcp</text>

    <rect x="14" y="186" width="182" height="36" rx="4" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="24" y="202" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#0369a1">Active Process State</text>
    <text x="24" y="215" font-family="monospace" font-size="9" fill="#0284c7">python app.py (CPU: 0.4% · 32MB)</text>
  </g>
</svg>
