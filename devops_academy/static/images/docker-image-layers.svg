    <text x="16" y="106" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">SHA-256 Digest:</text>
    <text x="16" y="122" font-family="monospace" font-size="9" font-weight="700" fill="#059669">sha256:7f9a8b13c2419e5...</text>

    <text x="16" y="150" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">Total Image Size:</text>
