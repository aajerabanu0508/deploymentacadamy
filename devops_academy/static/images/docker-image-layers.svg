    <rect x="14" y="184" width="182" height="28" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="26" y="202" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#059669">✓ OCI Certified Artifact</text>
