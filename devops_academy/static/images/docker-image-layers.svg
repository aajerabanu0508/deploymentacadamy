    <text x="14" y="88" font-family="monospace" font-size="9" fill="#1d4ed8">Application logic (app.py, templates) · diff-id: 4f1c9d</text>
    <rect x="270" y="60" width="60" height="18" rx="4" fill="#2563eb"/>
    <text x="275" y="73" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#fff">2.4 MB</text>

    <!-- Layer 2: RUN pip install -->
