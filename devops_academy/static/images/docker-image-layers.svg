    <text x="14" y="126" font-family="monospace" font-size="11" font-weight="700" fill="#d97706">Layer 2: RUN pip install -r reqs.txt</text>
    <text x="14" y="140" font-family="monospace" font-size="9" fill="#b45309">Flask, Jinja2 wheels (CACHED) · diff-id: 7e3b1a</text>
    <rect x="270" y="112" width="60" height="18" rx="4" fill="#d97706"/>
    <text x="272" y="125" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#fff">45.8 MB</text>

    <!-- Layer 1: FROM base -->
    <rect x="0" y="156" width="340" height="50" rx="6" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="14" y="178" font-family="monospace" font-size="11" font-weight="700" fill="#0284c7">Layer 1: FROM python:3.12-slim</text>
    <text x="14" y="194" font-family="monospace" font-size="9" fill="#0369a1">Debian Linux userland + Python runtime · diff-id: 1a8c3f</text>
    <rect x="270" y="166" width="60" height="18" rx="4" fill="#0284c7"/>
    <text x="272" y="179" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#fff">79.1 MB</text>

    <!-- Base Foundation Bracket -->
    <path d="M 0 216 L 340 216" stroke="#0f172a" stroke-width="3"/>
    <text x="80" y="235" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#475569">ALL LAYERS ARE 100% READ-ONLY (IMMUTABLE)</text>
