    <rect x="0" y="0" width="340" height="44" rx="6" fill="#f5f3ff" stroke="#c084fc" stroke-width="1.5"/>
    <text x="14" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#7c3aed">Layer 4: CMD ["python", "app.py"]</text>
    <text x="14" y="36" font-family="monospace" font-size="9" fill="#9333ea">Runtime Entrypoint metadata · diff-id: 9a2b8e</text>
    <rect x="270" y="8" width="60" height="18" rx="4" fill="#7c3aed"/>
    <text x="278" y="21" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#fff">0 MB</text>

    <!-- Layer 3: COPY code -->
