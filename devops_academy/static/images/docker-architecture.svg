<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="640" height="320" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="640" height="42" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="38" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="21" r="5" fill="#10b981"/>
  <text x="74" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">DOCKER ENGINE ARCHITECTURE &amp; SUBSYSTEMS</text>

  <!-- Box 1: Client CLI -->
  <g transform="translate(24, 65)">
    <rect width="160" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#0284c7"/>
    <text x="14" y="23" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1. Docker Client (CLI)</text>
    
    <text x="14" y="65" font-family="monospace" font-size="11" font-weight="600" fill="#0284c7">$ docker build</text>
    <text x="14" y="90" font-family="monospace" font-size="11" font-weight="600" fill="#0284c7">$ docker run</text>
    <text x="14" y="115" font-family="monospace" font-size="11" font-weight="600" fill="#0284c7">$ docker pull</text>
    <text x="14" y="140" font-family="monospace" font-size="11" font-weight="600" fill="#0284c7">$ docker compose</text>

    <rect x="12" y="165" width="136" height="50" rx="4" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="20" y="184" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#0369a1">UNIX Domain Socket</text>
    <text x="20" y="200" font-family="monospace" font-size="9" fill="#0284c7">/var/run/docker.sock</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 194 175 L 226 175" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <polygon points="228,175 220,170 220,180" fill="#0284c7"/>

  <!-- Box 2: Docker Host (Daemon) -->
  <g transform="translate(236, 65)">
    <rect width="210" height="230" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="210" height="36" rx="8" fill="#0f172a"/>
    <text x="14" y="23" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2. Docker Daemon (dockerd)</text>

    <!-- Sub components inside daemon -->
    <rect x="14" y="52" width="182" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="24" y="70" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">API Server &amp; Image Engine</text>
    <text x="24" y="85" font-family="monospace" font-size="10" fill="#64748b">Layer caching, digest SHA</text>

    <rect x="14" y="104" width="182" height="42" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="24" y="122" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284c7">containerd (Runtime Core)</text>
    <text x="24" y="137" font-family="monospace" font-size="10" fill="#0369a1">Process lifecycle, snapshot</text>

    <rect x="14" y="156" width="182" height="60" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="24" y="174" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#059669">Storage Driver: Overlay2</text>
    <text x="24" y="190" font-family="monospace" font-size="9" fill="#047857">lowerdir: Read-only layers</text>
    <text x="24" y="204" font-family="monospace" font-size="9" fill="#047857">upperdir: Ephemeral CoW</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <polygon points="460,175 452,170 452,180" fill="#0f172a"/>

  <!-- Box 3: Linux Kernel -->
  <g transform="translate(468, 65)">
    <rect width="148" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="148" height="36" rx="8" fill="#1e293b"/>
    <text x="12" y="23" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">3. Linux Kernel</text>

    <rect x="10" y="52" width="128" height="74" rx="6" fill="#fdf4ff" stroke="#f0abfc"/>
    <text x="18" y="70" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#a21caf">NAMESPACES</text>
    <text x="18" y="85" font-family="monospace" font-size="9" fill="#701a75">PID (Process tree)</text>
    <text x="18" y="98" font-family="monospace" font-size="9" fill="#701a75">NET (Private eth0)</text>
    <text x="18" y="111" font-family="monospace" font-size="9" fill="#701a75">MNT (Filesystem root)</text>

    <rect x="10" y="136" width="128" height="74" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="18" y="154" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#b45309">CGROUPS LIMITS</text>
    <text x="18" y="170" font-family="monospace" font-size="9" fill="#92400e">cpu.max (Quota)</text>
    <text x="18" y="184" font-family="monospace" font-size="9" fill="#92400e">memory.max (Heap)</text>
    <text x="18" y="198" font-family="monospace" font-size="9" fill="#92400e">pids.max (Fork bomb)</text>
  </g>
</svg>
